# WhatsApp gateway — HTTPS reverse proxy
# /etc/nginx/sites-available/app.phoenixdms.com
# 4010 yalnızca localhost; dışarı 80/443.

upstream wa_gateway {
    server 127.0.0.1:4010;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.phoenixdms.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.phoenixdms.com;

    ssl_certificate     /etc/letsencrypt/live/app.phoenixdms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.phoenixdms.com/privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://wa_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
