# iOS paketini Mac olmadan üretir: Codemagic macOS makinesinde derleyip TestFlight'a yükler.
# Gerekli ortam değişkenleri (Codemagic > Environment variables):
#   grup "mobil_env": VITE_API_BASE_URL, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY,
#                     CERTIFICATE_PRIVATE_KEY (iOS dağıtım sertifikasının özel anahtarı)
#   Apple bağlantısı: Settings > Integrations > App Store Connect ("OnlineVIP ASC")
workflows:
  ios-testflight:
    name: iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: OnlineVIP ASC
    environment:
      groups:
        - mobil_env
      vars:
        BUNDLE_ID: com.dersonlinevipkocluk.student
        XCODE_PROJECT: student-coaching-system/ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
    scripts:
      - name: Web derlemesi (Capacitor kabuğunun içeriği)
        script: |
          cd student-coaching-system
          cat > .env.mobile <<EOF
          VITE_API_BASE_URL=$VITE_API_BASE_URL
          VITE_SUPABASE_URL=$VITE_SUPABASE_URL
          VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY
          EOF
          npm ci
          npm run build:mobile
      - name: Capacitor iOS senkronu
        script: |
          cd student-coaching-system
          npx cap sync ios
      - name: Swift Package bağımlılıkları (Capacitor 8 SPM kullanır, Podfile yok)
        script: |
          cd student-coaching-system/ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
      - name: İmzalama profilleri (App Store Connect API anahtarı ile otomatik)
        script: |
          set -e
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "HATA: CERTIFICATE_PRIVATE_KEY tanımlı değil."
            echo "Codemagic > Applications > bu uygulama > Environment variables:"
            echo "  ad: CERTIFICATE_PRIVATE_KEY · grup: mobil_env · Secure işaretli"
            echo "  değer: ios_cert_key.pem dosyasının tamamı (BEGIN/END satırları dahil)"
            exit 1
          fi
          keychain initialize
          # Dağıtım sertifikası yoksa CERTIFICATE_PRIVATE_KEY ile bir kez oluşturulur.
          # Aynı anahtar her derlemede kullanıldığı için Apple'ın sertifika limiti dolmaz.
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --save || echo "Sertifika oluşturulamadı (muhtemelen zaten var), mevcut olan denenecek"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          # Keychain'de imzalama kimliği var mı — yoksa arşiv adımı anlaşılmaz hata veriyor
          if ! security find-identity -v -p codesigning "$CM_BUILD_DIR/keychain.db" 2>/dev/null | grep -q "valid identities found"; then
            security find-identity -v -p codesigning || true
          fi
          # Profil/sertifika doğrudan bu projeye işlenir (kök taramada bulunamıyordu)
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --code-signing-setup-verbose-logging
      - name: Derleme numarasını artır
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          NEXT=$(($LATEST + 1))
          cd student-coaching-system/ios/App
          agvtool new-version -all $NEXT
      - name: IPA üret
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # TestFlight'ta iç test grubuna otomatik dağıt (grup adını Codemagic'te güncelleyin)
        beta_groups:
          - Ic Test
      email:
        recipients:
          - ceyhunogrenenefe@gmail.com
        notify:
          success: true
          failure: true
